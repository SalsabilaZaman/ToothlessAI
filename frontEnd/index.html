<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Friend</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Chat with Toothless</h1>
    <textarea id="userMessage" placeholder="Tell me something..." rows="5"></textarea>
    <button onclick="sendMessage()">Send</button>

    <div class="response">
      <p><strong>Mood:</strong> <span id="mood"></span></p>
      <p><strong>AI Reply:</strong> <span id="reply"></span></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
